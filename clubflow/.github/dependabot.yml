version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - "Bridge-tecnologia-e-consultoria/devops"
    assignees:
      - "antonioneto19"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps): "
      prefix-development: "chore(deps-dev): "
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "03:00"
    reviewers:
      - "Bridge-tecnologia-e-consultoria/devops"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci): "
